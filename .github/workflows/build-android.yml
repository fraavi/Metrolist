name: Build Android

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/**'
      - '**.md'
  workflow_dispatch:
    inputs:
      variant:
        description: APK variant to build and upload as an artifact
        type: choice
        options: [izzy, release, debug]
        default: izzy

permissions:
  contents: write

concurrency:
  group: android-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Android
    uses: ./.github/workflows/reusable-android-build.yml
    permissions:
      contents: read
    with:
      variant: ${{ inputs.variant || 'izzy' }}
      upload-artifact: true
      require-signing: true
      cache-read-only: false
    secrets:
      KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH || secrets.KEYSTORE }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
      LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
      GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      LYPRIO_BASE_URL: ${{ secrets.LYPRIO_BASE_URL }}
      LYPRIO_HMAC_KEY: ${{ secrets.LYPRIO_HMAC_KEY }}

  publish-release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Scarica APK compilato
        uses: actions/download-artifact@v4
        with:
          name: android-build
          path: artifacts

      - name: Prepara APK con nome compatibile con AppUpdateManager
        run: |
          mkdir -p release_assets
          APK_FILE=$(find artifacts -name "*.apk" | head -n 1)
          echo "Trovato APK: $APK_FILE"
          cp "$APK_FILE" release_assets/Metrolist-Android-release.apk

      - name: Pubblica Release Nightly su GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly Build
          prerelease: true
          make_latest: false
          files: release_assets/Metrolist-Android-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
